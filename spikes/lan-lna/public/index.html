<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b45309">
  <title>LAN Spike</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 14px 40px; background: #fff; color: #111; }
    h1 { font-size: 18px; margin: 4px 0 8px; } .warn { color: #b45309; font-weight: 600; }
    .ctx { background: #f4f4f5; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
    .ctx b { display: inline-block; min-width: 110px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input, select { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; width: 100%; margin-top: 8px; }
    button.main { background: #111; color: #fff; border-color: #111; font-weight: 600; font-size: 17px; }
    .row { display: flex; gap: 8px; } .row button { flex: 1; }
    #result { margin-top: 10px; padding: 10px; border-radius: 10px; font-weight: 600; min-height: 1.4em; }
    #result.ok { background: #dcfce7; color: #166534; } #result.err { background: #fee2e2; color: #991b1b; }
    #log { font: 11.5px/1.35 ui-monospace, monospace; white-space: pre-wrap; background: #111; color: #e5e5e5; padding: 8px; border-radius: 8px; margin-top: 10px; max-height: 50vh; overflow: auto; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <h1>LAN Spike <span class="warn">(disposable test, not SendLink)</span></h1>
  <div class="ctx" id="ctx">…</div>

  <label for="scenario">Scenario being tested</label>
  <select id="scenario">
    <option value="S1">S1 — Chrome tab, Wi-Fi + Internet</option>
    <option value="S2">S2 — installed app opened from home screen</option>
    <option value="S3">S3 — installed app launched from Share</option>
    <option value="S4">S4 — WAN OFF + mobile data OFF + Wi-Fi ON</option>
    <option value="S5">S5 — WAN OFF + mobile data ON</option>
  </select>

  <label for="ip">PC LAN IP (printed by the agent)</label>
  <input id="ip" inputmode="decimal" placeholder="192.168.x.y" autocomplete="off">

  <button id="send" class="main">Send to local agent (A)</button>
  <div id="result"></div>
  <div class="row">
    <button id="sendB">B: no targetAddressSpace</button>
    <button id="sendC">C: simple GET</button>
  </div>
  <div class="row">
    <button id="perm">Check permission</button>
    <button id="copy">Copy log</button>
    <button id="clear">Clear log</button>
  </div>
  <div id="log"></div>
</body>
</html>
